<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>博客控制台</title>

<svg style="display:none" aria-hidden="true">
<symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/></symbol>
<symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></symbol>
<symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-save" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></symbol>
<symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></symbol>
<symbol id="i-git" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="8" r="2.5"/><path d="M6 8.5v7M18 10.5c0 4-5 3-9 5"/></symbol>
<symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></symbol>
<symbol id="i-external" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></symbol>
<symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></symbol>
<symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></symbol>
<symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></symbol>
<symbol id="i-left" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
<symbol id="i-right" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
</svg><style>
:root{
  --bg:#0d0f13; --sidebar:#101318; --card:#141920; --card2:#181e26; --border:#232a34;
  --text:#e4e8ef; --muted:#8b93a1; --faint:#626b7a;
  --accent:#b8344a; --accent-soft:rgba(184,52,74,.12);
  --ok:#3fb950; --warn:#d29922; --err:#f85149; --code:#0a0c0f;
}
html[data-theme="light"]{
  --bg:#f7f8fa; --sidebar:#ffffff; --card:#ffffff; --card2:#f3f5f8; --border:#e5e8ee;
  --text:#1b2028; --muted:#6b7280; --faint:#98a0ad; --accent:#a3233a; --code:#f5f6f8;
}
*{box-sizing:border-box}
*{scrollbar-width:thin;scrollbar-color:#2c3542 transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2c3542;border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#3b4657;background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}
html[data-theme="light"] *{scrollbar-color:#cdd4de transparent}
html[data-theme="light"] ::-webkit-scrollbar-thumb{background:#cdd4de;background-clip:content-box}
html[data-theme="light"] ::-webkit-scrollbar-thumb:hover{background:#b7c0cc;background-clip:content-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.app{display:flex;height:100%}

/* rail */
.rail{width:206px;flex:0 0 auto;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px 10px}
.rail-brand{display:flex;align-items:center;gap:9px;padding:4px 8px 16px}
.rail-brand .logo{width:26px;height:26px;border-radius:7px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.rail-brand .name{font-weight:600;font-size:13.5px;letter-spacing:.2px}
.rail-brand .sub{font-size:10.5px;color:var(--faint)}
.nav{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 10px;border:0;background:transparent;color:var(--muted);border-radius:7px;font:inherit;font-size:13px;cursor:pointer;text-align:left}
.nav:hover{background:var(--card2);color:var(--text)}
.nav.on{background:var(--accent-soft);color:var(--text);font-weight:500}
.nav.on svg.i{color:var(--accent)}
.rail-sep{height:1px;background:var(--border);margin:10px 6px}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px}

/* main */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;padding:22px 26px 14px;gap:16px}
.head h1{margin:0;font-size:20px;font-weight:600;letter-spacing:.2px}
.head p{margin:4px 0 0;font-size:12px;color:var(--faint)}
.head-actions{display:flex;gap:8px;align-items:center}
.page{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 26px 18px}
.page.pad{padding:0 26px 18px}

/* buttons */
.btn{height:30px;padding:0 12px;border-radius:7px;border:1px solid var(--border);background:var(--card);color:var(--text);font:inherit;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.12s}
.btn:hover{border-color:var(--faint);background:var(--card2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn.icon{width:30px;padding:0;justify-content:center}
.btn.danger:hover{border-color:var(--err);color:var(--err)}

/* cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:10px}
.card-h{padding:13px 16px;border-bottom:1px solid var(--border);font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.card-b{padding:14px 16px}

/* posts */
.split{flex:1;display:flex;gap:16px;min-height:0}
.list-card{width:300px;flex:0 0 auto;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.list-tools{padding:10px;border-bottom:1px solid var(--border);display:flex;gap:8px}
.search{flex:1;position:relative}
.search svg{position:absolute;left:9px;top:7px;color:var(--faint)}
.search input{width:100%;height:30px;padding:0 9px 0 30px;border-radius:7px;border:1px solid var(--border);background:var(--bg);color:var(--text);font:inherit;font-size:12.5px;outline:none}
.search input:focus{border-color:var(--faint)}
.posts{overflow:auto;padding:6px}
.post{display:flex;gap:9px;padding:9px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.post:hover{background:var(--card2)}
.post.on{background:var(--accent-soft);border-color:rgba(184,52,74,.3)}
.post .dot{width:6px;height:6px;border-radius:50%;background:var(--faint);margin-top:6px;flex:0 0 auto}
.post.on .dot{background:var(--accent)}
.post .body{min-width:0;flex:1}
.post .t{font-size:12.8px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post .m{font-size:11px;color:var(--faint);margin-top:2px;display:flex;gap:8px}

.editor{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.ed-bar{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.ed-bar .file{font-size:12.5px;font-weight:500}
.ed-bar .sub{font-size:11.5px;color:var(--faint)}
.grow{flex:1}
.panes{flex:1;display:flex;min-height:0}
textarea{flex:1;border:0;outline:none;resize:none;padding:18px 22px;background:var(--bg);color:var(--text);font:13.5px/1.8 "Cascadia Code",Consolas,"Microsoft YaHei",monospace;tab-size:2}
.preview{flex:1;overflow:auto;padding:18px 24px;border-left:1px solid var(--border);background:var(--card)}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;padding:14px;border-bottom:1px solid var(--border);background:var(--card2)}
.meta-grid .full{grid-column:1/-1}
label.f{display:block;font-size:11px;color:var(--faint);margin-bottom:4px}
input.f{width:100%;height:29px;padding:0 9px;border-radius:7px;border:1px solid var(--border);background:var(--bg);color:var(--text);font:inherit;font-size:12.5px;outline:none}
input.f:focus{border-color:var(--faint)}
.row{display:flex;gap:8px}
.row input{flex:1}

/* media */
.media-split{flex:1;display:flex;gap:16px;min-height:0}
.folders{width:210px;flex:0 0 auto;overflow:auto;padding:6px}
.folder{display:flex;align-items:center;justify-content:space-between;padding:7px 9px;border-radius:7px;cursor:pointer;font-size:12.5px;color:var(--muted)}
.folder:hover{background:var(--card2);color:var(--text)}
.folder.on{background:var(--accent-soft);color:var(--text)}
.folder .n{font-size:11px;color:var(--faint)}
.media-main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.media-bar{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.media-body{flex:1;overflow:auto}
.rows{display:block}
.row-item{display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--border);cursor:pointer;font-size:12.5px}
.row-item:hover{background:var(--card2)}
.row-item .badge{width:26px;height:26px;border-radius:6px;background:var(--card2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:9.5px;color:var(--muted);text-transform:uppercase;flex:0 0 auto}
.row-item .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-item .dir{width:210px;color:var(--faint);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto}
.row-item .sz{width:64px;text-align:right;color:var(--faint);font-size:11px;flex:0 0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:12px;padding:14px}
.tile{border:1px solid var(--border);border-radius:9px;overflow:hidden;background:var(--card);cursor:pointer}
.tile:hover{border-color:var(--faint)}
.tile .ph{aspect-ratio:4/3;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:11px}
.tile img{aspect-ratio:4/3;width:100%;object-fit:cover;display:block}
.tile .cap{padding:7px 9px;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .cap span{color:var(--faint);font-size:10.5px}

/* deploy */
.deploy-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.stat{padding:16px}
.stat .k{font-size:11.5px;color:var(--faint)}
.stat .v{font-size:15px;font-weight:600;margin-top:6px;word-break:break-all}
.stat .d{font-size:11.5px;color:var(--muted);margin-top:4px}
.log-card{margin-top:14px;flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.log{flex:1;overflow:auto;padding:8px 14px;font:11.5px/1.7 "Cascadia Code",Consolas,monospace;color:var(--muted);background:var(--code);border-radius:0 0 9px 9px}
.log .l{white-space:pre-wrap;word-break:break-all}
.log .err{color:var(--err)} .log .ok{color:var(--ok)} .log .cmd{color:var(--accent)} .log .warn{color:var(--warn)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;z-index:60}
.panel{background:var(--card);border:1px solid var(--border);border-radius:11px;box-shadow:0 26px 60px rgba(0,0,0,.45);width:520px;max-width:92vw;max-height:88vh;overflow:auto}
.panel .ph{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--border);font-size:13px;font-weight:600}
.panel .pb{padding:16px}
.panel .pf{display:flex;justify-content:flex-end;gap:8px;padding:13px 16px;border-top:1px solid var(--border)}
.thumb-lg{width:100%;border-radius:8px;border:1px solid var(--border);background:var(--card2);min-height:120px}
.kv{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint);margin-top:8px;gap:10px}
.copy{font:11.5px/1.6 "Cascadia Code",Consolas,monospace;background:var(--code);border:1px solid var(--border);border-radius:7px;padding:8px 10px;word-break:break-all;margin-top:10px}
.field{margin-bottom:11px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--border);padding:9px 16px;border-radius:8px;font-size:12.5px;z-index:90;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.toast.ok{border-color:rgba(63,185,80,.5);color:var(--ok)}
.toast.err{border-color:rgba(248,81,73,.5);color:var(--err)}
.hidden{display:none!important}
.markdown-body{max-width:760px;font-size:14px;line-height:1.75}
.markdown-body h1{font-size:1.55em;border-bottom:1px solid var(--border);padding-bottom:.3em}
.markdown-body h2{font-size:1.25em;margin-top:1.5em}
.markdown-body a{color:#7aa2f7}
.markdown-body code{background:var(--code);padding:1px 5px;border-radius:4px;font-size:.9em}
.markdown-body pre{background:var(--code);border:1px solid var(--border);border-radius:8px;padding:12px 14px;overflow:auto}
.markdown-body blockquote{margin:0;padding:4px 14px;border-left:2px solid var(--accent);color:var(--muted)}
.markdown-body table{border-collapse:collapse;width:100%}
.markdown-body th,.markdown-body td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.markdown-body img{max-width:100%;border-radius:6px}
</style>
</head>
<body>

<div class="app">
  <aside class="rail">
    <div class="rail-brand">
      <span class="logo">m</span>
      <div><div class="name">博客控制台</div><div class="sub">Hexo Blog Console</div></div>
    </div>
    <button class="nav on" data-page="posts"><svg class="i"><use href="#i-file"/></svg>文章</button>
    <button class="nav" data-page="pages"><svg class="i"><use href="#i-file"/></svg>页面</button>
    <button class="nav" data-page="media"><svg class="i"><use href="#i-image"/></svg>图库</button>
    <button class="nav" data-page="deploy"><svg class="i"><use href="#i-upload"/></svg>部署</button>
    <button class="nav" data-page="settings"><svg class="i"><use href="#i-sliders"/></svg>设置</button>
    <div class="rail-sep"></div>
    <div class="rail-foot">
      <button class="nav" id="btnTheme"><svg class="i" id="themeIcon"><use href="#i-moon"/></svg><span id="themeText">深色</span></button>
      <button class="nav" id="btnSite"><svg class="i"><use href="#i-external"/></svg>打开站点</button>
    </div>
  </aside>

  <div class="main">
    <div class="head">
      <div>
        <h1 id="pageTitle">文章</h1>
        <p id="pageSub">共 0 篇</p>
      </div>
      <div class="head-actions" id="headActions"></div>
    </div>

    <section class="page" id="pagePosts">
      <div class="split">
        <div class="card list-card">
          <div class="list-tools">
            <div class="search"><svg class="i"><use href="#i-search"/></svg><input id="search" placeholder="搜索标题或标签"></div>
          </div>
          <div class="posts" id="postList"></div>
        </div>

        <div class="card editor">
          <div class="ed-bar">
            <span class="file" id="current">未选择文章</span>
            <span class="sub" id="metaInfo"></span>
            <span class="grow"></span>
            <span class="sub" id="autosave"></span>
            <span class="sub" id="counter"></span>
            <button class="btn sm" id="btnImage"><svg class="i"><use href="#i-image"/></svg>图片</button>
            <button class="btn sm" id="btnMeta"><svg class="i"><use href="#i-sliders"/></svg>元信息</button>
            <button class="btn sm" id="btnTogglePreview"><svg class="i"><use href="#i-file"/></svg>预览</button>
            <button class="btn sm" id="btnSave"><svg class="i"><use href="#i-save"/></svg>保存</button>
            <button class="btn sm danger icon" id="btnDelete" title="删除"><svg class="i"><use href="#i-trash"/></svg></button>
          </div>
          <div class="meta-grid hidden" id="metaPanel">
            <div><label class="f">标题</label><input class="f" id="mTitle"></div>
            <div><label class="f">日期</label><input class="f" id="mDate"></div>
            <div><label class="f">标签</label><input class="f" id="mTags"></div>
            <div><label class="f">分类</label><input class="f" id="mCats"></div>
            <div class="full"><label class="f">描述</label><input class="f" id="mDesc"></div>
            <div class="full"><label class="f">封面</label><div class="row"><input class="f" id="mCover"><button class="btn sm" id="btnCover"><svg class="i"><use href="#i-upload"/></svg>上传</button></div></div>
          </div>
          <div class="panes">
            <textarea id="content" spellcheck="false" placeholder="选择左侧的文章，或新建一篇"></textarea>
            <div class="preview hidden" id="previewPane"><div class="markdown-body" id="previewBody"></div></div>
          </div>
        </div>
      </div>
    </section>

    <section class="page hidden" id="pagePages">
      <div class="split">
        <div class="card list-card">
          <div class="card-h" style="padding:10px 12px"><svg class="i"><use href="#i-file"/></svg>独立页面</div>
          <div class="posts" id="pageList"></div>
        </div>
        <div class="card editor">
          <div class="ed-bar">
            <span class="file" id="pageCurrent">未选择页面</span>
            <span class="sub" id="pageInfo"></span>
            <span class="grow"></span>
            <span class="sub" id="pageCounter"></span>
            <button class="btn sm" id="btnPageSave"><svg class="i"><use href="#i-save"/></svg>保存</button>
          </div>
          <div class="panes"><textarea id="pageContent" spellcheck="false" placeholder="选择左侧页面"></textarea></div>
        </div>
      </div>
    </section>

    <section class="page hidden" id="pageSettings">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start">
        <div class="card">
          <div class="card-h"><svg class="i"><use href="#i-sliders"/></svg>侧边栏链接</div>
          <div class="card-b" id="sideLinks"></div>
        </div>
        <div class="card">
          <div class="card-h"><svg class="i"><use href="#i-sliders"/></svg>顶栏链接</div>
          <div class="card-b" id="navLinks"></div>
        </div>
      </div>
      <div class="card" style="margin-top:14px">
        <div class="card-h"><svg class="i"><use href="#i-file"/></svg>文案</div>
        <div class="card-b">
          <div class="field"><label class="f">侧边栏公告（留空则不显示）</label><input class="f" id="setAnnouncement" placeholder="一句话介绍，支持 HTML"></div>
          <div class="field" style="margin-bottom:0"><label class="f">页脚文字（留空则不显示）</label><input class="f" id="setFooter" placeholder="例如：© 2026 milkmoli"></div>
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-top:14px;align-items:center">
        <button class="btn primary" id="btnSettingsSave"><svg class="i"><use href="#i-save"/></svg>保存设置</button>
        <span class="sub" style="font-size:11.5px;color:var(--faint)">保存后需在「部署」页发布才会生效；改动写入主题 _config.yml</span>
      </div>
    </section>

    <section class="page hidden" id="pageMedia">
      <div class="media-split">
        <div class="card" style="width:210px;flex:0 0 auto;display:flex;flex-direction:column;min-height:0;overflow:hidden">
          <div class="card-h" style="padding:10px 12px"><svg class="i"><use href="#i-image"/></svg>文件夹</div>
          <div class="folders" id="folders"></div>
        </div>
        <div class="card media-main">
          <div class="media-bar">
            <div class="search" style="max-width:240px"><svg class="i"><use href="#i-search"/></svg><input id="mediaSearch" placeholder="搜索文件名"></div>
            <span class="sub" id="mediaCount"></span>
            <span class="grow"></span>
            <button class="btn sm" id="btnMediaLayout"><svg class="i"><use href="#i-sliders"/></svg>列表</button>
          </div>
          <div class="media-body" id="mediaBody"></div>
        </div>
      </div>

    <section class="page hidden" id="pageDeploy">
      <div class="deploy-grid">
        <div class="card stat"><div class="k">上次发布</div><div class="v" id="statDeploy">-</div><div class="d" id="statDeploySub">尚未发布</div></div>
        <div class="card stat"><div class="k">源码版本</div><div class="v" id="statGit">-</div><div class="d" id="statGitSub">-</div></div>
        <div class="card stat"><div class="k">站点地址</div><div class="v" id="statSite" style="font-size:13px">-</div><div class="d">GitHub Pages</div></div>
      </div>
      <div class="card log-card">
        <div class="card-h" style="padding:9px 14px"><svg class="i"><use href="#i-terminal"/></svg>运行日志<span class="grow"></span><button class="btn sm" id="btnClearLog">清空</button></div>
        <div class="log" id="log"></div>

</div>

<div class="modal hidden" id="mediaModal">
  <div class="panel">
    <div class="ph"><span id="mmTitle">图片</span><span class="grow" style="flex:1"></span><span class="sub" id="mmPos" style="color:var(--faint);font-size:11.5px;margin-right:8px"></span><button class="btn sm icon" id="mmPrev" title="上一张"><svg class="i"><use href="#i-left"/></svg></button><button class="btn sm icon" id="mmNext" title="下一张"><svg class="i"><use href="#i-right"/></svg></button><button class="btn sm icon" id="mmClose"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="pb">
      <div style="position:relative">
        <img class="thumb-lg" id="mmImg" alt="">
        <div id="mmLoad" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--faint);background:var(--card2);border:1px solid var(--border);border-radius:8px">载入中</div>
      </div>
      <div class="kv"><span id="mmPath"></span><span id="mmSize"></span></div>
      <div class="copy" id="mmMarkdown"></div>
    </div>
    <div class="pf">
      <button class="btn sm" id="mmCopyMd"><svg class="i"><use href="#i-copy"/></svg>复制 Markdown</button>
      <button class="btn sm" id="mmCopyUrl"><svg class="i"><use href="#i-link"/></svg>复制链接</button>
      <button class="btn sm danger" id="mmDelete"><svg class="i"><use href="#i-trash"/></svg>删除</button>
    </div>
  </div>
</div>

<div class="modal hidden" id="modal">
  <div class="panel">
    <div class="ph"><span>新建文章</span><button class="btn sm icon" id="btnCancelNew"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="pb">
      <div class="field"><label class="f">标题</label><input class="f" id="fTitle" placeholder="文章标题"></div>
      <div class="row" style="display:flex;gap:10px">
        <div class="field" style="flex:1"><label class="f">文件名（决定网址）</label><input class="f" id="fSlug" placeholder="留空则用标题"></div>
        <div class="field" style="flex:1"><label class="f">日期</label><input class="f" id="fDate"></div>
      </div>
      <div class="row" style="display:flex;gap:10px">
        <div class="field" style="flex:1"><label class="f">标签</label><input class="f" id="fTags" placeholder="Hexo, 教程"></div>
        <div class="field" style="flex:1"><label class="f">分类</label><input class="f" id="fCats" placeholder="教程"></div>
      </div>
      <div class="field"><label class="f">描述</label><input class="f" id="fDesc"></div>
      <div class="field"><label class="f">封面</label><input class="f" id="fCover"></div>
      <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)"><input type="checkbox" id="fDraft"> 存为草稿（不生成页面）</label>
    </div>
    <div class="pf">
      <button class="btn sm" id="btnCreateCancel">取消</button>
      <button class="btn sm primary" id="btnCreate">创建</button>
    </div>
  </div>
</div>

<div class="toast hidden" id="toast"></div>
<input type="file" id="filePicker" accept="image/*" multiple style="display:none">

<script>

var state = { page:'posts', file:null, dirty:false, posts:[], lastSeq:0, previewing:false, publishing:false, config:{}, autoTimer:null, images:[], mediaFolder:'', mediaLayout:'list', mmPath:null };
var $ = function (id) { return document.getElementById(id); };
var esc = function (s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); };
var el = function (tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

function api(p, o) { return fetch(p, o).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); return j; }); }); }
function postJSON(p, b) { return api(p, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(b || {}) }); }
function toast(msg, kind) { var t = $('toast'); t.textContent = msg; t.className = 'toast ' + (kind || ''); clearTimeout(window._t); window._t = setTimeout(function () { t.className = 'toast hidden'; }, 2600); }
function fmtSize(n) { if (!n) return ''; if (n < 1024) return n + ' B'; if (n < 1048576) return (n/1024).toFixed(0) + ' KB'; return (n/1048576).toFixed(1) + ' MB'; }
function fmtDate(d) { return d ? String(d).replace(/:00$/, '') : ''; }
function folderOf(p) { return p.split('/').slice(0, -1).join('/') || '根目录'; }

/* 页面 */
function setPage(page) {
  state.page = page;
  var navs = document.querySelectorAll('.nav[data-page]');
  for (var i = 0; i < navs.length; i++) navs[i].className = 'nav' + (navs[i].getAttribute('data-page') === page ? ' on' : '');
  $('pagePosts').classList.toggle('hidden', page !== 'posts');
  $('pageMedia').classList.toggle('hidden', page !== 'media');
  $('pageDeploy').classList.toggle('hidden', page !== 'deploy');
  $('pagePages').classList.toggle('hidden', page !== 'pages');
  $('pageSettings').classList.toggle('hidden', page !== 'settings');
  $('pageTitle').textContent = { posts:'文章', pages:'页面', media:'图库', deploy:'部署', settings:'设置' }[page] || '';
  if (page === 'posts') {
    $('pageSub').textContent = '共 ' + state.posts.length + ' 篇';
    $('headActions').innerHTML = '<button class="btn primary" id="btnNew"><svg class="i"><use href="#i-plus"/></svg>新建文章</button>';
    $('btnNew').onclick = openNew;
    renderPosts();
  } else if (page === 'media') {
    $('pageSub').textContent = '图床上传与整理';
    $('headActions').innerHTML = '<button class="btn" id="btnRefresh2"><svg class="i"><use href="#i-refresh"/></svg>刷新</button><button class="btn primary" id="btnUpload2"><svg class="i"><use href="#i-upload"/></svg>上传图片</button>';
    $('btnRefresh2').onclick = function () { loadImages(true); };
    $('btnUpload2').onclick = function () { uploadMode = 'media'; $('filePicker').click(); };
    if (!state.images.length) loadImages();
    renderFolders(); renderMedia();
  } else if (page === 'pages') {
    $('pageSub').textContent = '关于、友链等独立页面';
    $('headActions').innerHTML = '';
    if (!state.pages || !state.pages.length) loadPages(); else renderPages();
  } else if (page === 'settings') {
    $('pageSub').textContent = '侧边栏、顶栏与文案';
    $('headActions').innerHTML = '<button class="btn" id="btnSettingsReload"><svg class="i"><use href="#i-refresh"/></svg>重新读取</button>';
    $('btnSettingsReload').onclick = loadSettings;
    loadSettings();
  } else {
    $('pageSub').textContent = '构建并发布到 GitHub Pages';
    $('headActions').innerHTML = '<button class="btn" id="btnPreview"><svg class="i" id="prevIcon"><use href="#i-play"/></svg><span id="prevText">本地预览</span></button><button class="btn primary" id="btnPublish"><svg class="i"><use href="#i-upload"/></svg>发布上线</button>';
    $('btnPreview').onclick = togglePreview;
    $('btnPublish').onclick = publish;
  }
}

/* 文章 */
function renderPosts() {
  var q = $('search').value.trim().toLowerCase();
  var box = $('postList'); box.innerHTML = '';
  var list = state.posts.filter(function (p) { return !q || (p.title + ' ' + p.tags + ' ' + p.categories).toLowerCase().indexOf(q) >= 0; });
  if (!list.length) { box.appendChild(el('div', '', '没有匹配的文章')).style.cssText = 'padding:20px;color:var(--faint);font-size:12px;text-align:center'; return; }
  list.forEach(function (p) {
    var e = el('div', 'post' + (p.file === state.file ? ' on' : ''));
    e.innerHTML = '<div class="dot"></div><div class="body"><div class="t">' + esc(p.title) + (p.draft ? ' · 草稿' : '') + '</div><div class="m"><span>' + esc(fmtDate(p.date)) + '</span><span>' + p.chars + ' 字</span></div></div>';
    e.onclick = function () { openPost(p.file); };
    box.appendChild(e);
  });
}
function fillMeta(m) { $('mTitle').value = m.title || ''; $('mDate').value = m.date || ''; $('mTags').value = m.tags || ''; $('mCats').value = m.categories || ''; $('mDesc').value = m.description || ''; $('mCover').value = m.cover || ''; }
function openPost(file) {
  if (state.dirty && !confirm('当前文章有未提交的修改，确定切换吗？')) return;
  api('/api/post?file=' + encodeURIComponent(file)).then(function (j) {
    state.file = j.file; state.dirty = false;
    $('content').value = j.content; $('current').textContent = j.file;
    fillMeta(j.meta);
    $('metaInfo').textContent = (j.meta.date || '') + (j.meta.categories ? ' · ' + j.meta.categories : '');
    renderPosts(); updateCounter();
    if (!$('previewPane').classList.contains('hidden')) renderPreview();
  }).catch(function (e) { toast('打开失败：' + e.message, 'err'); });
}
function updateCounter() { $('counter').textContent = $('content').value.replace(/\s/g, '').length + ' 字'; }
function loadPosts() { return api('/api/posts').then(function (j) { state.posts = j.posts; if (state.page === 'posts') { renderPosts(); $('pageSub').textContent = '共 ' + j.posts.length + ' 篇'; } }); }
function renderPreview() { postJSON('/api/render', { text: $('content').value }).then(function (j) { $('previewBody').innerHTML = j.html; }); }
function save(opts) {
  opts = opts || {};
  if (!state.file) { toast('先选择或新建文章', 'err'); return Promise.resolve(); }
  return postJSON('/api/save', { file: state.file, content: $('content').value, commit: opts.commit !== false }).then(function (j) {
    state.dirty = false;
    if (opts.commit === false) { $('autosave').textContent = '已自动保存 ' + new Date().toLocaleTimeString('zh-CN'); return j; }
    var c = j.git;
    toast(c && c.hash ? '已保存并提交 ' + c.hash : (c && c.reason === 'no-repo' ? '已保存（未纳入 git）' : '已保存'), 'ok');
    loadPosts(); return j;
  }).catch(function (e) { toast('保存失败：' + e.message, 'err'); });
}

/* 页面管理 */
function loadPages() {
  return api('/api/pages').then(function (j) {
    state.pages = j.pages;
    renderPages();
  }).catch(function (e) { toast('页面读取失败：' + e.message, 'err'); });
}

function renderPages() {
  var box = $('pageList');
  box.innerHTML = '';
  (state.pages || []).forEach(function (pg) {
    var e = el('div', 'post' + (pg.path === state.pageFile ? ' on' : ''));
    e.innerHTML = '<div class="dot"></div><div class="body"><div class="t">' + esc(pg.title) + '</div>' +
      '<div class="m"><span>' + esc(pg.type || '页面') + '</span><span>' + pg.chars + ' 字</span></div></div>';
    e.onclick = function () { openPage(pg); };
    box.appendChild(e);
  });
  if (!(state.pages || []).length) {
    var e2 = el('div', '', '没有独立页面');
    e2.style.cssText = 'padding:20px;color:var(--faint);font-size:12px;text-align:center';
    box.appendChild(e2);
  }
}

function openPage(pg) {
  api('/api/page?path=' + encodeURIComponent(pg.path)).then(function (j) {
    state.pageFile = pg.path;
    $('pageContent').value = j.content;
    $('pageCurrent').textContent = pg.path;
    $('pageInfo').textContent = pg.type || '';
    $('pageCounter').textContent = j.content.replace(/\s/g, '').length + ' 字';
    renderPages();
  }).catch(function (e) { toast('打开失败：' + e.message, 'err'); });
}

/* 设置 */
function linkRows(obj) {
  var out = {};
  Object.keys(obj || {}).forEach(function (k) { out[k] = { path: obj[k].path || '', icon: obj[k].icon || '' }; });
  return out;
}

function renderLinkEditor(containerId, obj) {
  var box = $(containerId);
  box.innerHTML = '';
  var wrap = el('div');
  Object.keys(obj).forEach(function (name) {
    var row = el('div', '');
    row.style.cssText = 'display:flex;gap:6px;margin-bottom:6px';
    row.innerHTML = '<input class="f" data-k="name" value="' + esc(name) + '" placeholder="名称" style="width:86px">' +
      '<input class="f" data-k="path" value="' + esc(obj[name].path) + '" placeholder="/path" style="flex:1">' +
      '<input class="f" data-k="icon" value="' + esc(obj[name].icon) + '" placeholder="fa-regular fa-link" style="width:150px">';
    var del = el('button', 'btn sm icon', '<svg class="i"><use href="#i-trash"/></svg>');
    del.onclick = function () { row.remove(); };
    row.appendChild(del);
    wrap.appendChild(row);
  });
  var add = el('button', 'btn sm', '<svg class="i"><use href="#i-plus"/></svg>添加链接');
  add.style.marginTop = '4px';
  add.onclick = function () {
    var row = el('div', '');
    row.style.cssText = 'display:flex;gap:6px;margin-bottom:6px';
    row.innerHTML = '<input class="f" data-k="name" placeholder="名称" style="width:86px">' +
      '<input class="f" data-k="path" placeholder="/path" style="flex:1">' +
      '<input class="f" data-k="icon" placeholder="fa-regular fa-link" style="width:150px">';
    var d = el('button', 'btn sm icon', '<svg class="i"><use href="#i-trash"/></svg>');
    d.onclick = function () { row.remove(); };
    row.appendChild(d);
    wrap.insertBefore(row, add);
  };
  wrap.appendChild(add);
  box.appendChild(wrap);
}

function collectLinks(containerId) {
  var out = {};
  [].slice.call($(containerId).querySelectorAll('input[data-k="name"]')).forEach(function (nameInput) {
    var row = nameInput.parentElement;
    var name = nameInput.value.trim();
    if (!name) return;
    out[name] = {
      path: row.querySelector('input[data-k="path"]').value.trim(),
      icon: row.querySelector('input[data-k="icon"]').value.trim()
    };
  });
  return out;
}

function loadSettings() {
  return api('/api/settings').then(function (s) {
    state.settings = s;
    renderLinkEditor('sideLinks', s.sidebarLinks || {});
    renderLinkEditor('navLinks', s.navbarLinks || {});
    $('setAnnouncement').value = s.announcement || '';
    $('setFooter').value = s.footer || '';
    return s;
  }).catch(function (e) { toast('设置读取失败：' + e.message, 'err'); });
}

/* 图库 */
function loadImages(force) {
  $('mediaCount').textContent = '加载中';
  return api('/api/images' + (force ? '?refresh=1' : '')).then(function (j) {
    state.images = j.items; $('mediaCount').textContent = j.total + ' 张';
    renderFolders(); renderMedia();
  }).catch(function (e) { $('mediaCount').textContent = '加载失败'; toast('图库加载失败：' + e.message, 'err'); });
}
function renderFolders() {
  var box = $('folders'); box.innerHTML = '';
  if (!state.images.length) return;
  var counts = {};
  state.images.forEach(function (it) { var f = folderOf(it.path); counts[f] = (counts[f] || 0) + 1; });
  var rows = [{ n:'全部图片', v:'', c: state.images.length }];
  Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; }).forEach(function (f) { rows.push({ n:f, v:f, c:counts[f] }); });
  rows.forEach(function (r) {
    var e = el('div', 'folder' + (state.mediaFolder === r.v ? ' on' : ''), '<span>' + esc(r.n) + '</span><span class="n">' + r.c + '</span>');
    e.onclick = function () { state.mediaFolder = r.v; renderFolders(); renderMedia(); };
    box.appendChild(e);
  });
}
function renderMedia() {
  var q = $('mediaSearch').value.trim().toLowerCase();
  var box = $('mediaBody'); box.innerHTML = '';
  var list = state.images.filter(function (it) { return (!state.mediaFolder || folderOf(it.path) === state.mediaFolder) && (!q || it.name.toLowerCase().indexOf(q) >= 0); });
  if (!list.length) { var e0 = el('div', '', '没有图片'); e0.style.cssText = 'padding:30px;color:var(--faint);font-size:12px;text-align:center'; box.appendChild(e0); return; }
  if (state.mediaLayout === 'list') {
    var wrap = el('div', 'rows');
    list.forEach(function (it) {
      var r = el('div', 'row-item');
      r.innerHTML = '<span class="badge">' + esc((it.name.split('.').pop() || '').toUpperCase().slice(0, 4)) + '</span><span class="nm" title="' + esc(it.path) + '">' + esc(it.name) + '</span><span class="dir">' + esc(folderOf(it.path)) + '</span><span class="sz">' + fmtSize(it.size) + '</span>';
      r.onclick = function () { openImage(it); };
      wrap.appendChild(r);
    });
    box.appendChild(wrap);
  } else {
    var grid = el('div', 'grid');
    tileMap = {};
    if (gridObserver) { gridObserver.disconnect(); gridObserver = null; }
    gridObserver = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        var t = en.target;
        if (t.getAttribute('data-queued') === '1') return;
        t.setAttribute('data-queued', '1');
        enqueueThumb(t._job);
        gridObserver.unobserve(t);
      });
    }, { root: $('mediaBody'), rootMargin: '240px' });

    list.forEach(function (it) {
      var t = el('div', 'tile');
      var ph = el('div', 'ph', '等待加载');
      var img = document.createElement('img');
      img.alt = it.name; img.style.display = 'none';
      var cap = el('div', 'cap', esc(it.name) + '<br><span>' + fmtSize(it.size) + '</span>');
      t.appendChild(ph); t.appendChild(img); t.appendChild(cap);
      t.onclick = function () { openImage(it); };
      var job = { url: it.thumb || it.url, fallback: it.url, img: img, ph: ph, path: it.path, retried: false };
      t._job = job;
      tileMap[it.path] = job;
      grid.appendChild(t);
      gridObserver.observe(t);
    });
    box.appendChild(grid);
  }
}
function currentMediaList() {
  var q = $('mediaSearch').value.trim().toLowerCase();
  return state.images.filter(function (x) {
    return (!state.mediaFolder || folderOf(x.path) === state.mediaFolder) && (!q || x.name.toLowerCase().indexOf(q) >= 0);
  });
}
var tileMap = {};
var gridObserver = null;
var thumbQueue = [];
var thumbActive = 0;
var THUMB_MAX = 5;

function altCdn(url) {
  if (url.indexOf('cdn.jsdelivr.net') >= 0) return url.replace('cdn.jsdelivr.net', 'fastly.jsdelivr.net');
  return url;
}

function enqueueThumb(job) {
  if (!job) return;
  thumbQueue.push(job);
  pumpThumbs();
}

function pumpThumbs() {
  while (thumbActive < THUMB_MAX && thumbQueue.length) {
    startThumb(thumbQueue.shift());
  }
}

function startThumb(job) {
  thumbActive += 1;
  var img = job.img;
  job.ph.textContent = '载入中';
  job.ph.style.display = 'flex';
  img.onload = function () {
    thumbActive -= 1;
    job.ph.style.display = 'none';
    img.style.display = 'block';
    job.loaded = true;
    pumpThumbs();
  };
  img.onerror = function () {
    if (!job.retried) {
      job.retried = true;
      img.src = job.fallback || altCdn(job.url);
      return;
    }
    thumbActive -= 1;
    job.ph.textContent = '无法预览';
    pumpThumbs();
  };
  img.src = job.url;
}

function openImage(it) {
  var list = currentMediaList();
  state.mmIndex = list.findIndex(function (x) { return x.path === it.path; });
  state.mmPath = it.path;
  $('mmPos').textContent = (state.mmIndex + 1) + ' / ' + list.length;
  $('mmTitle').textContent = it.name; $('mmPath').textContent = it.path; $('mmSize').textContent = fmtSize(it.size);
  $('mmMarkdown').textContent = '![' + it.name.replace(/\.[^.]+$/, '') + '](' + it.url + ')';
  var ld = $('mmLoad');
  ld.style.display = 'flex';
  ld.textContent = '载入中';
  $('mmImg').onload = function () {
    ld.style.display = 'none';
    var job = tileMap[it.path];
    if (job && !job.loaded) {
      job.loaded = true;
      job.ph.style.display = 'none';
      job.img.src = job.url || it.url;
      job.img.style.display = 'block';
    }
  };
  $('mmImg').onerror = function () { ld.textContent = '无法预览这张图'; };
  $('mmImg').src = it.url;
  $('mediaModal').classList.remove('hidden');
}

/* 上传 */
var uploadMode = 'insert';
function toBase64(f) { return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(String(r.result).split(',')[1]); }; r.onerror = rej; r.readAsDataURL(f); }); }
function insertAtCursor(text) {
  var t = $('content'); var s = t.selectionStart || 0, e = t.selectionEnd || 0;
  t.value = t.value.slice(0, s) + text + t.value.slice(e);
  t.selectionStart = t.selectionEnd = s + text.length;
  t.dispatchEvent(new Event('input'));
}
async function uploadFiles(files) {
  for (var i = 0; i < files.length; i++) {
    var f = files[i];
    try {
      toast('正在上传 ' + f.name);
      var b64 = await toBase64(f);
      var j = await postJSON('/api/upload', { name: f.name, data: b64 });
      var saved = '';
      if (j.compress && j.compress.before > j.compress.after) {
        var kb = function (n) { return Math.round(n / 1024) + 'KB'; };
        saved = '（压缩 ' + kb(j.compress.before) + ' → ' + kb(j.compress.after) + '）';
      }
      if (uploadMode === 'cover') { $('mCover').value = j.url; $('mCover').dispatchEvent(new Event('change', { bubbles:true })); toast('封面已更新' + saved, 'ok'); }
      else if (uploadMode === 'media') { toast('已上传' + saved, 'ok'); }
      else { insertAtCursor('![' + f.name.replace(/\.[^.]+$/, '') + '](' + j.url + ')\n'); toast('已插入 ' + f.name + saved, 'ok'); }
    } catch (e) { toast('上传失败：' + e.message, 'err'); }
  }
  if (uploadMode === 'media') loadImages(true);
  uploadMode = 'insert';
}

/* 部署 */
var phases = { commit:'提交源码', clean:'清理产物', generate:'构建站点', deploy:'推送到 GitHub', done:'完成' };
function togglePreview() {
  if (state.previewing) { postJSON('/api/stop-preview').then(function () { toast('已停止本地预览'); poll(); }); }
  else { toast('正在启动本地预览'); postJSON('/api/preview').then(function (j) { if (!j.ok) toast('预览启动失败', 'err'); poll(); }).catch(function () { toast('预览启动失败', 'err'); }); }
}
function publish() {
  if (state.publishing) return;
  if (!confirm('构建并推送到 GitHub Pages，大约 1-3 分钟。继续？')) return;
  var go = state.dirty ? save() : Promise.resolve();
  go.then(function () { state.publishing = true; setPage('deploy'); postJSON('/api/publish').catch(function (e) { state.publishing = false; toast(e.message, 'err'); }); });
}
function appendLog(line) { var b = $('log'); var e = el('div', 'l ' + (line.level || '')); e.textContent = line.text; b.appendChild(e); b.scrollTop = b.scrollHeight; }
function poll() {
  api('/api/state').then(function (s) {
    if (s.publish && s.publish.running) { $('statDeploySub').textContent = phases[s.publish.phase] || '处理中'; }
    else if (state.publishing) { state.publishing = false; loadPosts(); }
    if (s.lastDeploy) { $('statDeploy').textContent = s.lastDeploy; if (!(s.publish && s.publish.running)) $('statDeploySub').textContent = '点击右上角重新发布'; }
    state.previewing = s.preview;
    var pt = $('prevText'); if (pt) pt.textContent = s.preview ? '停止预览' : '本地预览';
    var pi = $('prevIcon'); if (pi) pi.innerHTML = '<use href="' + (s.preview ? '#i-stop' : '#i-play') + '"/>';
    if (s.git) {
      if (!s.git.ready) { $('statGit').textContent = '未初始化'; $('statGitSub').textContent = '请先初始化源码仓库'; }
      else { $('statGit').textContent = String(s.git.last || '').slice(0, 7); $('statGitSub').textContent = s.git.dirty ? ('有 ' + s.git.files + ' 项未提交') : '已同步到远端'; }
    }
  }).catch(function () {});
  api('/api/log?since=' + state.lastSeq).then(function (j) { j.lines.forEach(appendLog); state.lastSeq = j.seq; }).catch(function () {});
}

/* 事件 */
var navs = document.querySelectorAll('.nav[data-page]');
for (var i = 0; i < navs.length; i++) (function (b) { b.onclick = function () { setPage(b.getAttribute('data-page')); }; })(navs[i]);
$('search').oninput = renderPosts;
$('mediaSearch').oninput = renderMedia;
$('btnMediaLayout').onclick = function () {
  state.mediaLayout = state.mediaLayout === 'list' ? 'grid' : 'list';
  $('btnMediaLayout').innerHTML = '<svg class="i"><use href="#i-sliders"/></svg>' + (state.mediaLayout === 'list' ? '列表' : '缩略图');
  try { localStorage.setItem('blogConsoleMediaLayout', state.mediaLayout); } catch (e) {}
  renderMedia();
};
$('btnClearLog').onclick = function () { $('log').innerHTML = ''; };
$('btnPageSave').onclick = function () {
  if (!state.pageFile) return toast('先选择一个页面', 'err');
  postJSON('/api/page/save', { path: state.pageFile, content: $('pageContent').value })
    .then(function () { toast('页面已保存', 'ok'); loadPages(); })
    .catch(function (e) { toast('保存失败：' + e.message, 'err'); });
};

$('btnSettingsSave').onclick = function () {
  postJSON('/api/settings', {
    sidebarLinks: collectLinks('sideLinks'),
    navbarLinks: collectLinks('navLinks'),
    announcement: $('setAnnouncement').value,
    footer: $('setFooter').value
  }).then(function () {
    toast('设置已保存，去「部署」页发布后生效', 'ok');
  }).catch(function (e) { toast('保存失败：' + e.message, 'err'); });
};

$('btnSave').onclick = function () { save(); };
$('btnMeta').onclick = function () { $('metaPanel').classList.toggle('hidden'); };
$('btnTogglePreview').onclick = function () { var p = $('previewPane'); p.classList.toggle('hidden'); if (!p.classList.contains('hidden')) renderPreview(); };
$('btnImage').onclick = function () { uploadMode = 'insert'; $('filePicker').click(); };
$('btnCover').onclick = function () { uploadMode = 'cover'; $('filePicker').click(); };
$('filePicker').onchange = function (e) { var f = [].slice.call(e.target.files); e.target.value = ''; if (f.length) uploadFiles(f); };
$('btnDelete').onclick = function () {
  if (!state.file) return;
  if (!confirm('把《' + state.file + '》移入 _trash 回收站？')) return;
  postJSON('/api/delete', { file: state.file }).then(function () {
    toast('已移入回收站', 'ok'); state.file = null; state.dirty = false;
    $('content').value = ''; $('current').textContent = '未选择文章'; loadPosts();
  }).catch(function (e) { toast('删除失败：' + e.message, 'err'); });
};
$('metaPanel').addEventListener('change', function () {
  if (!state.file) return;
  postJSON('/api/meta', { file: state.file, fields: { title:$('mTitle').value, date:$('mDate').value, tags:$('mTags').value, categories:$('mCats').value, description:$('mDesc').value, cover:$('mCover').value } })
    .then(function (j) { $('content').value = j.content; $('metaInfo').textContent = ($('mDate').value || '') + ' · ' + ($('mCats').value || ''); toast('元信息已更新', 'ok'); loadPosts(); })
    .catch(function (e) { toast('更新失败：' + e.message, 'err'); });
});
$('content').oninput = function () {
  state.dirty = true; updateCounter();
  if (!$('previewPane').classList.contains('hidden')) { clearTimeout(window._rt); window._rt = setTimeout(renderPreview, 350); }
  $('autosave').textContent = '未保存';
  clearTimeout(state.autoTimer);
  state.autoTimer = setTimeout(function () { if (state.dirty) save({ commit:false }); }, state.config.autoSaveMs || 4000);
};
function openNew() {
  var n = new Date(), p = function (x) { return (x < 10 ? '0' : '') + x; };
  $('fDate').value = n.getFullYear() + '-' + p(n.getMonth()+1) + '-' + p(n.getDate()) + ' ' + p(n.getHours()) + ':' + p(n.getMinutes()) + ':00';
  $('fTitle').value = ''; $('fSlug').value = ''; $('fTags').value = ''; $('fCats').value = ''; $('fDesc').value = '';
  $('fCover').value = state.config.defaultCover || ''; $('fDraft').checked = false;
  $('modal').classList.remove('hidden');
  setTimeout(function () { $('fTitle').focus(); }, 30);
}
$('btnCancelNew').onclick = function () { $('modal').classList.add('hidden'); };
$('btnCreateCancel').onclick = function () { $('modal').classList.add('hidden'); };
$('btnCreate').onclick = function () {
  var t = $('fTitle').value.trim();
  if (!t) return toast('标题不能为空', 'err');
  postJSON('/api/new', { title:t, slug:$('fSlug').value.trim(), date:$('fDate').value, tags:$('fTags').value, categories:$('fCats').value, description:$('fDesc').value, cover:$('fCover').value, draft:$('fDraft').checked })
    .then(function (j) { $('modal').classList.add('hidden'); setPage('posts'); loadPosts().then(function () { openPost(j.file); }); toast('已创建 ' + j.file, 'ok'); })
    .catch(function (e) { toast('创建失败：' + e.message, 'err'); });
};
$('mmClose').onclick = function () { $('mediaModal').classList.add('hidden'); };
function stepImage(delta) {
  var list = currentMediaList();
  if (!list.length) return;
  var i = (state.mmIndex + delta + list.length) % list.length;
  openImage(list[i]);
}
$('mmPrev').onclick = function () { stepImage(-1); };
$('mmNext').onclick = function () { stepImage(1); };

/* 点击背景 / 面板空白处关闭弹窗 */
function closeModal(id) { var m = $(id); if (m) m.classList.add('hidden'); }
function bindBackdrop(id, keepSel) {
  var m = $(id);
  if (!m) return;
  m.addEventListener('click', function (e) {
    var t = e.target;
    if (!t) return;
    if (t === m) return closeModal(id);
    var panel = t.closest ? t.closest('.panel') : null;
    if (!panel) return closeModal(id);
    if (keepSel && t.closest && t.closest(keepSel)) return;
    if (t === panel || (t.classList && t.classList.contains('pb'))) closeModal(id);
  });
}
bindBackdrop('mediaModal', 'img, .kv, .copy, .pf, .ph, button, a');
bindBackdrop('modal', 'input, textarea, label, select, .pf, .ph, button, a');

$('mmCopyUrl').onclick = function () { var it = state.images.filter(function (x) { return x.path === state.mmPath; })[0]; if (!it) return; navigator.clipboard.writeText(it.url).then(function () { toast('链接已复制', 'ok'); }); };
$('mmCopyMd').onclick = function () { var it = state.images.filter(function (x) { return x.path === state.mmPath; })[0]; if (!it) return; navigator.clipboard.writeText('![' + it.name.replace(/\.[^.]+$/, '') + '](' + it.url + ')').then(function () { toast('Markdown 已复制', 'ok'); }); };
$('mmDelete').onclick = function () {
  if (!state.mmPath) return;
  if (!confirm('确定从图床删除这张图片？引用它的文章会显示不出来。')) return;
  postJSON('/api/images/delete', { path: state.mmPath }).then(function () { $('mediaModal').classList.add('hidden'); toast('已删除', 'ok'); loadImages(true); }).catch(function (e) { toast('删除失败：' + e.message, 'err'); });
};
$('btnTheme').onclick = function () {
  var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  $('themeIcon').innerHTML = '<use href="' + (next === 'dark' ? '#i-moon' : '#i-sun') + '"/>';
  $('themeText').textContent = next === 'dark' ? '深色' : '浅色';
  try { localStorage.setItem('blogConsoleTheme', next); } catch (e) {}
};
$('btnSite').onclick = function () { if (state.config.siteUrl) window.open(state.config.siteUrl, '_blank'); };
document.addEventListener('keydown', function (e) {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'n') { e.preventDefault(); if (state.page === 'posts') openNew(); }
  if (e.key === 'Escape') { $('modal').classList.add('hidden'); $('mediaModal').classList.add('hidden'); }
  if (!$('mediaModal').classList.contains('hidden')) {
    if (e.key === 'ArrowLeft') { e.preventDefault(); stepImage(-1); }
    if (e.key === 'ArrowRight') { e.preventDefault(); stepImage(1); }
  }
});
try {
  var th = localStorage.getItem('blogConsoleTheme');
  if (th) { document.documentElement.setAttribute('data-theme', th); $('themeIcon').innerHTML = '<use href="' + (th === 'dark' ? '#i-moon' : '#i-sun') + '"/>'; $('themeText').textContent = th === 'dark' ? '深色' : '浅色'; }
  var ml = localStorage.getItem('blogConsoleMediaLayout');
  if (ml) state.mediaLayout = ml;
} catch (e) {}

api('/api/config').then(function (c) {
  state.config = c;
  document.title = '博客控制台 · ' + (c.siteUrl || c.blogDir || '');
  $('statSite').textContent = c.siteUrl || '-';
  loadPosts().then(function () { setPage('posts'); if (state.posts[0]) openPost(state.posts[0].file); });
  loadImages();
});
setInterval(poll, 1200);
poll();

</script>
</body>
</html>
